<text x="30" y="1080" class="net" text-anchor="start">TB6612：VM 是电机电源；VCC 是逻辑电源，不能把 12V 接入 VCC。</text>
<text x="30" y="1125" class="net" text-anchor="start">电源负极用粗线接驱动电源侧 GND；主控地线不承担电机、舵机的大电流。</text>
<text x="30" y="1170" class="sm" text-anchor="start">三个 GND 通常板内相通，断电两两测通。舵机三针完整定义：S / ＋5V / GND。</text>
<text x="30" y="1210" class="sm" text-anchor="start">交叉无圆点＝不相连；有实心圆点＝汇接。若另用无线继电器，其供电/触点端子须按实物型号另行核对。</text>
</svg>