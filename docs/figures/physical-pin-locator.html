      });
      const views = {
        a: {box:'490 580 770 470', marks:['a'], detail:'A：照片已旋转便于辨认，圆点指焊点，排针在板下。VM 接12V，VCC 接3.3V，三个GND共地。'},
        b: {box:'135 820 780 510', marks:['b'], detail:'B：照片已旋转便于辨认；A/B仅表示照片位置，不代表前后轴。VM 接12V，VCC 接3.3V，三个GND共地。'},
        boards: {box:'0 0 1368 700', marks:['boards'], detail:'代码：ESP GPIO4 TX → STM PA3 RX；ESP GPIO6 RX ← STM PA2 TX；GND共地。照片不能确认每根线的另一端。'},
        all: {box:'0 0 1368 1824', marks:['overview'], detail:'A 为照片右上驱动板，B 为左下驱动板；点相应按钮看全部16针。现有跳线的另一端尚未验证。'}
      };
      function selectView(name, persist) {
        const config = views[name] || views.a;
        drawing.setAttribute('viewBox', config.box);
        const photoRotation = pinPhotos[name];
        drawing.querySelector('image').setAttribute('transform',photoRotation ? 'rotate('+photoRotation.angle+' '+photoRotation.cx+' '+photoRotation.cy+')' : '');
        root.querySelectorAll('[data-marks]').forEach(group => {
          const hide = !config.marks.includes(group.dataset.marks);
          group.toggleAttribute('hidden', hide);
          group.style.display = hide ? 'none' : '';
        });
        root.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === name)));
        detail.textContent = config.detail;
        if (persist && window.openai && window.openai.setWidgetState) {
          window.openai.setWidgetState({modelContent:{photoRegion:name},privateContent:null}).catch(() => {});
        }
      }
      root.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => selectView(button.dataset.view, true)));
      const saved = window.openai && window.openai.widgetState;
      selectView(saved && saved.modelContent && saved.modelContent.photoRegion || 'a', false);
      window.addEventListener('openai:set_globals', event => {
        const state = event.detail && event.detail.globals && event.detail.globals.widgetState;
        if (state && state.modelContent && views[state.modelContent.photoRegion]) selectView(state.modelContent.photoRegion, false);
      });
    })();
  </script>
</div>
